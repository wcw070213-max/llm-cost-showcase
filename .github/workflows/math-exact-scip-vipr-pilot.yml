name: Math exact SCIP VIPR pilot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/math-exact-scip-vipr-pilot.yml'
      - 'math_exact/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  SCIP_URL: https://github.com/scipopt/scip/releases/download/v10.0.3/scipoptsuite-10.0.3-glibc2_28-amd64.tgz
  SCIP_TGZ_SHA256: ddbb7129bdb83f8f70ed26391d206fd1658139e44c7c7fd7d73a1e4cefbca94f
  VIPR_COMMIT: 30f2951d1e90e47afa821bdd1b12b82246656c42

jobs:
  exact-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Recover and verify frozen LP models
        run: |
          mkdir -p exact_models exact_results
          for id in 352 589; do
            base64 -d "math_exact/models/model_${id}.lp.xz.b64" > "exact_models/model_${id}.lp.xz"
            xz -t "exact_models/model_${id}.lp.xz"
            xz -dc "exact_models/model_${id}.lp.xz" > "exact_models/model_${id}.lp"
          done
          test "$(sha256sum exact_models/model_352.lp.xz | cut -d' ' -f1)" = "e82ce3c3d1dbcfa8f1ef54e7cda3f5a3fe4a316a683774e128371af97423b019"
          test "$(sha256sum exact_models/model_589.lp.xz | cut -d' ' -f1)" = "e884d61f18bf02d7fdb61f4b759ff34703500e1600771eb40a6cad37d8643853"
          test "$(sha256sum exact_models/model_352.lp | cut -d' ' -f1)" = "1d549df8d1c5b46746fdaa569cf3dccbf71667211afc4a53a10bd1803e3ddb15"
          test "$(sha256sum exact_models/model_589.lp | cut -d' ' -f1)" = "a2c5f1257a5330ed8c81837ad14a3eb204ac8c32d15e94d1b94e932c95fa18e1"
          grep -q 'model_id=352 profile=R5_RHO4_TAU3 model_sha256=116f2c2dc96447c74b617285bbb0c757c8434f0f08a89dcc04ebce299f937aa3' exact_models/model_352.lp
          grep -q 'model_id=589 profile=R5_RHO4_TAU3 model_sha256=d7e26cb2' exact_models/model_589.lp
          sha256sum exact_models/* | tee exact_results/model_input_sha256.txt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libgmp-dev libboost-all-dev zlib1g-dev

      - name: Install official SCIP 10.0.3 release
        run: |
          curl -L --fail --retry 3 -o scip.tgz "$SCIP_URL"
          test "$(sha256sum scip.tgz | cut -d' ' -f1)" = "$SCIP_TGZ_SHA256"
          tar -xzf scip.tgz
          SCIP_BIN="$(find scipoptsuite-10.0.3 -type f -name scip -perm -111 | head -1)"
          test -n "$SCIP_BIN"
          echo "$SCIP_BIN" > scip_binary.txt
          "$SCIP_BIN" -c 'display parameters' -c quit > exact_results/scip_parameters.txt 2>&1 || true
          grep -q 'exact/enable' exact_results/scip_parameters.txt
          grep -q 'certificate/filename' exact_results/scip_parameters.txt
          "$SCIP_BIN" -v > exact_results/scip_version.txt 2>&1 || true
          sha256sum "$SCIP_BIN" > exact_results/scip_binary_sha256.txt

      - name: Build pinned VIPR checker
        run: |
          git clone https://github.com/scipopt/vipr.git vipr
          git -C vipr checkout "$VIPR_COMMIT"
          cmake -S vipr/code -B vipr/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVIPRCOMP=OFF
          cmake --build vipr/build --target viprchk -j 2
          git -C vipr rev-parse HEAD > exact_results/vipr_commit.txt
          test "$(cat exact_results/vipr_commit.txt)" = "$VIPR_COMMIT"
          sha256sum vipr/build/viprchk > exact_results/viprchk_sha256.txt

      - name: Run exact SCIP/VIPR regression model 352
        run: |
          SCIP_BIN="$(cat scip_binary.txt)"
          mkdir -p exact_results/model_352
          cat > exact_results/model_352/scip.set <<'EOF'
          set exact enable TRUE
          set separating gomory freq -1
          set conflict enable FALSE
          set limits time 300
          set certificate filename exact_results/model_352/proof.vipr
          read exact_models/model_352.lp
          optimize
          display statistics
          quit
          EOF
          "$SCIP_BIN" -b exact_results/model_352/scip.set > exact_results/model_352/scip.stdout 2> exact_results/model_352/scip.stderr
          grep -Eiq 'problem is solved \[infeasible\]|SCIP Status[[:space:]]*:[[:space:]]*problem is solved \[infeasible\]' exact_results/model_352/scip.stdout
          test -s exact_results/model_352/proof.vipr
          vipr/build/viprchk exact_results/model_352/proof.vipr > exact_results/model_352/viprchk.stdout 2> exact_results/model_352/viprchk.stderr
          sha256sum exact_results/model_352/* > exact_results/model_352/SHA256SUMS
          echo MODEL_352_EXACT_SCIP_VIPR_REGRESSION_PASS

      - name: Run exact SCIP/VIPR pilot model 589
        run: |
          SCIP_BIN="$(cat scip_binary.txt)"
          mkdir -p exact_results/model_589
          cat > exact_results/model_589/scip.set <<'EOF'
          set exact enable TRUE
          set separating gomory freq -1
          set conflict enable FALSE
          set limits time 1200
          set certificate filename exact_results/model_589/proof.vipr
          read exact_models/model_589.lp
          optimize
          display statistics
          quit
          EOF
          set +e
          timeout 1500 "$SCIP_BIN" -b exact_results/model_589/scip.set > exact_results/model_589/scip.stdout 2> exact_results/model_589/scip.stderr
          rc=$?
          set -e
          echo "$rc" > exact_results/model_589/scip_returncode.txt
          if grep -Eiq 'problem is solved \[infeasible\]|SCIP Status[[:space:]]*:[[:space:]]*problem is solved \[infeasible\]' exact_results/model_589/scip.stdout && test -s exact_results/model_589/proof.vipr; then
            vipr/build/viprchk exact_results/model_589/proof.vipr > exact_results/model_589/viprchk.stdout 2> exact_results/model_589/viprchk.stderr
            echo CERTIFIED_UNSAT > exact_results/model_589/mathematical_status.txt
          else
            echo UNKNOWN_OR_TIMEOUT > exact_results/model_589/mathematical_status.txt
          fi
          sha256sum exact_results/model_589/* > exact_results/model_589/SHA256SUMS
          cat exact_results/model_589/mathematical_status.txt

      - name: Create machine-readable summary
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          root=Path('exact_results')
          def sh(p):
              return hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
          out={
            'schema':'rank5_exact_scip_vipr_two_model_pilot_v1',
            'model_352':{
              'lp_sha256':sh(Path('exact_models/model_352.lp')),
              'proof_exists':Path('exact_results/model_352/proof.vipr').exists(),
              'proof_sha256':sh(Path('exact_results/model_352/proof.vipr')),
              'checker_stdout_sha256':sh(Path('exact_results/model_352/viprchk.stdout')),
            },
            'model_589':{
              'lp_sha256':sh(Path('exact_models/model_589.lp')),
              'proof_exists':Path('exact_results/model_589/proof.vipr').exists(),
              'proof_sha256':sh(Path('exact_results/model_589/proof.vipr')),
              'status':Path('exact_results/model_589/mathematical_status.txt').read_text().strip() if Path('exact_results/model_589/mathematical_status.txt').exists() else 'NOT_REACHED',
              'checker_stdout_sha256':sh(Path('exact_results/model_589/viprchk.stdout')),
            },
          }
          Path('exact_results/summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
          find exact_results -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > exact_results/SHA256SUMS

      - name: Upload exact proof pilot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RANK5_EXACT_SCIP_VIPR_TWO_MODEL_PILOT_V1
          path: exact_results
          compression-level: 0
          retention-days: 30
