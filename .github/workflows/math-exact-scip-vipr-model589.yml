name: Math exact SCIP VIPR model589 pilot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/math-exact-scip-vipr-model589.yml'
      - 'math_exact/MODEL589_TRIGGER.md'
      - 'math_exact/models/chunks/model_589.part*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SCIP_URL: https://github.com/scipopt/scip/releases/download/v10.0.3/scipoptsuite-10.0.3-glibc2_28-amd64.tgz
  SCIP_TGZ_SHA256: ddbb7129bdb83f8f70ed26391d206fd1658139e44c7c7fd7d73a1e4cefbca94f
  VIPR_COMMIT: 30f2951d1e90e47afa821bdd1b12b82246656c42
  MODEL352_SOURCE_RUN: 32766214616

jobs:
  model589-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble and verify frozen model 589
        run: |
          mkdir -p exact_models exact_results
          cat > chunks_589.sha256 <<'EOF'
          b9d876d9a6b9b6e94f896fe22684481ab969884842123118f442b1d681edda2b  math_exact/models/chunks/model_589.part00
          421d6814ce2c013d4d9a882cf514fe2021c703d1a5b472ed5dbc995b2f5d5a98  math_exact/models/chunks/model_589.part01
          abf46699bbdc9cdbb91b5ce583a3ebf850a3e507451d0fc8dbc323c6c4811597  math_exact/models/chunks/model_589.part02
          d7baebae0ca7ed3ff9e9306ca1a66703df430e0bfb3a3eb0f24edd2875cff871  math_exact/models/chunks/model_589.part03
          220c62a408d191b58e8438ca49fd59f7576c15e2cacf3a720deed94b30bbaddc  math_exact/models/chunks/model_589.part04
          c0494c2f7d84895363608d6757ab369582e533c9856c22217cc1aee4cbe9ffce  math_exact/models/chunks/model_589.part05
          044d5b8ed6dd3b5961cdecfd3123842b0fb7a7eb931b46777435efb170648822  math_exact/models/chunks/model_589.part06
          8d833ae9fd5ca0c37d18ec450ffd7679158993083aa1b31477d7581a2e7841bf  math_exact/models/chunks/model_589.part07
          EOF
          sha256sum -c chunks_589.sha256
          cat math_exact/models/chunks/model_589.part* > exact_models/model_589.lp.xz.b64
          test "$(sha256sum exact_models/model_589.lp.xz.b64 | cut -d' ' -f1)" = "0e162cdfc5a67f68914b46354d875669944e399ea9d646f423f9651e5798cab9"
          base64 -d exact_models/model_589.lp.xz.b64 > exact_models/model_589.lp.xz
          test "$(sha256sum exact_models/model_589.lp.xz | cut -d' ' -f1)" = "e884d61f18bf02d7fdb61f4b759ff34703500e1600771eb40a6cad37d8643853"
          xz -t exact_models/model_589.lp.xz
          xz -dc exact_models/model_589.lp.xz > exact_models/model_589.lp
          test "$(sha256sum exact_models/model_589.lp | cut -d' ' -f1)" = "a2c5f1257a5330ed8c81837ad14a3eb204ac8c32d15e94d1b94e932c95fa18e1"
          grep -q 'model_id=589 profile=R5_RHO4_TAU3 model_sha256=d7e26cb20c2629ecd7b0b148f05977616e084951db5d19a8932855f3cd92c57b' exact_models/model_589.lp
          sha256sum exact_models/* chunks_589.sha256 > exact_results/model_input_sha256.txt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libgmp-dev zlib1g-dev

      - name: Build pinned VIPR checker
        run: |
          git clone https://github.com/scipopt/vipr.git vipr
          git -C vipr checkout "$VIPR_COMMIT"
          cmake -S vipr/code -B vipr/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVIPRCOMP=OFF
          cmake --build vipr/build --target viprchk -j 2
          git -C vipr rev-parse HEAD > exact_results/vipr_commit.txt
          test "$(cat exact_results/vipr_commit.txt)" = "$VIPR_COMMIT"
          sha256sum vipr/build/viprchk > exact_results/viprchk_sha256.txt

      - name: Download original-model model352 exact certificate
        uses: actions/download-artifact@v4
        with:
          name: RANK5_EXACT_SCIP_VIPR_MODEL352_ORIGINAL_REGRESSION_V1
          path: model352_gate
          github-token: ${{ github.token }}
          run-id: ${{ env.MODEL352_SOURCE_RUN }}

      - name: Cold-replay mandatory model352 hard gate
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('model352_gate/summary.json').read_text())
          assert d['model_id']==352
          assert d['model_sha256']=='116f2c2dc96447c74b617285bbb0c757c8434f0f08a89dcc04ebce299f937aa3'
          assert d['lp_sha256']=='1d549df8d1c5b46746fdaa569cf3dccbf71667211afc4a53a10bd1803e3ddb15'
          assert d['status']=='CERTIFIED_UNSAT'
          assert d['presolving_disabled'] is True
          assert d['separation_disabled'] is True
          assert d['proof_derivations']==451
          assert d['proof_target_tautological'] is False
          assert d['proof_sha256']=='3b9ccde6cb5b35ad40bc653802e3eda11e1b60004dbdbbdcba9f0adf7da83187'
          PY
          PROOF="$(find model352_gate/model_352 -maxdepth 1 -type f \( -name 'proof.vipr' -o -name 'proof.vipr_ori' \) | head -1)"
          test -s "$PROOF"
          test "$(sha256sum "$PROOF" | cut -d' ' -f1)" = "3b9ccde6cb5b35ad40bc653802e3eda11e1b60004dbdbbdcba9f0adf7da83187"
          grep -q '^RTP infeas$' "$PROOF"
          grep -q '^DER 451$' "$PROOF"
          vipr/build/viprchk "$PROOF" > exact_results/model352_gate_viprchk.stdout 2> exact_results/model352_gate_viprchk.stderr
          grep -q 'Successfully verified infeasibility' exact_results/model352_gate_viprchk.stdout
          echo MODEL352_ORIGINAL_EXACT_VIPR_HARD_GATE_PASS

      - name: Install and probe official SCIP 10.0.3 release
        run: |
          curl -L --fail --retry 3 -o scip.tgz "$SCIP_URL"
          test "$(sha256sum scip.tgz | cut -d' ' -f1)" = "$SCIP_TGZ_SHA256"
          tar -xzf scip.tgz
          SCIP_BIN="$(find scipoptsuite-10.0.3 -type f -name scip -perm -111 | head -1)"
          test -n "$SCIP_BIN"
          echo "$SCIP_BIN" > scip_binary.txt
          "$SCIP_BIN" -v > exact_results/scip_version.txt 2>&1 || true
          "$SCIP_BIN" -c 'set exact enable TRUE' -c 'set presolving emphasis off' -c 'set separating emphasis off' -c 'set certificate filename /tmp/scip-preflight.vipr' -c quit > exact_results/scip_preflight.txt 2>&1
          if grep -Eiq 'unknown parameter|invalid parameter|not a valid parameter' exact_results/scip_preflight.txt; then
            cat exact_results/scip_preflight.txt
            exit 1
          fi
          sha256sum "$SCIP_BIN" scip.tgz > exact_results/scip_binary_sha256.txt

      - name: Run original-model exact SCIP/VIPR pilot for model589
        run: |
          SCIP_BIN="$(cat scip_binary.txt)"
          mkdir -p exact_results/model_589
          cat > exact_results/model_589/scip.set <<'EOF'
          set exact enable TRUE
          set presolving emphasis off
          set separating emphasis off
          set conflict enable FALSE
          set limits time 1200
          set certificate filename exact_results/model_589/proof.vipr
          read exact_models/model_589.lp
          optimize
          write solution exact_results/model_589/solution.sol
          display statistics
          quit
          EOF
          set +e
          timeout 1350 "$SCIP_BIN" -b exact_results/model_589/scip.set > exact_results/model_589/scip.stdout 2> exact_results/model_589/scip.stderr
          rc=$?
          set -e
          echo "$rc" > exact_results/model_589/scip_returncode.txt
          status=UNKNOWN_OR_TIMEOUT
          if grep -Eiq 'problem is solved \[infeasible\]|SCIP Status[[:space:]]*:[[:space:]]*problem is solved \[infeasible\]' exact_results/model_589/scip.stdout; then
            if test -s exact_results/model_589/proof.vipr; then PROOF=exact_results/model_589/proof.vipr; else PROOF=exact_results/model_589/proof.vipr_ori; fi
            if test -s "$PROOF" && grep -Eq '^DER [1-9][0-9]*$' "$PROOF" && grep -q '^RTP infeas$' "$PROOF" && ! grep -q '^RTP range -inf inf$' "$PROOF"; then
              echo "$PROOF" > exact_results/model_589/proof_path.txt
              set +e
              vipr/build/viprchk "$PROOF" > exact_results/model_589/viprchk.stdout 2> exact_results/model_589/viprchk.stderr
              vrc=$?
              set -e
              echo "$vrc" > exact_results/model_589/viprchk_returncode.txt
              if test "$vrc" = 0 && grep -q 'Successfully verified infeasibility' exact_results/model_589/viprchk.stdout; then status=CERTIFIED_UNSAT; else status=PROOF_CHECK_FAILED; fi
            else
              status=PROOF_MISSING_OR_INVALID
            fi
          elif grep -Eiq 'problem is solved \[optimal solution found\]|SCIP Status[[:space:]]*:[[:space:]]*problem is solved \[optimal solution found\]' exact_results/model_589/scip.stdout; then
            status=SAT_REQUIRES_SEMANTIC_REPLAY
          fi
          echo "$status" > exact_results/model_589/mathematical_status.txt
          sha256sum exact_results/model_589/* > exact_results/model_589/SHA256SUMS
          cat exact_results/model_589/mathematical_status.txt

      - name: Create machine-readable summary
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          def sh(p): return hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
          d=Path('exact_results/model_589')
          p1=d/'proof.vipr'; p2=d/'proof.vipr_ori'; proof=p1 if p1.exists() else p2
          txt=proof.read_text(errors='replace') if proof.exists() else ''
          der=re.search(r'^DER\s+(\d+)\s*$',txt,re.M)
          out={'schema':'rank5_exact_scip_vipr_model589_pilot_v1','regression_gate':{'model_id':352,'model_sha256':'116f2c2dc96447c74b617285bbb0c757c8434f0f08a89dcc04ebce299f937aa3','proof_sha256':'3b9ccde6cb5b35ad40bc653802e3eda11e1b60004dbdbbdcba9f0adf7da83187','status':'CERTIFIED_UNSAT_COLD_REPLAY_PASS'},'queue_pilot':{'model_id':589,'model_sha256':'d7e26cb20c2629ecd7b0b148f05977616e084951db5d19a8932855f3cd92c57b','lp_sha256':'a2c5f1257a5330ed8c81837ad14a3eb204ac8c32d15e94d1b94e932c95fa18e1','presolving_disabled':True,'separation_disabled':True,'proof_file':str(proof) if proof.exists() else None,'proof_exists':proof.exists(),'proof_sha256':sh(proof),'proof_derivations':int(der.group(1)) if der else None,'proof_target_infeas':bool(re.search(r'^RTP infeas$',txt,re.M)),'proof_target_tautological':bool(re.search(r'^RTP range -inf inf$',txt,re.M)),'status':(d/'mathematical_status.txt').read_text().strip() if (d/'mathematical_status.txt').exists() else 'NOT_REACHED','checker_stdout_sha256':sh(d/'viprchk.stdout'),'solution_sha256':sh(d/'solution.sol')}}
          Path('exact_results/summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
          find exact_results -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > exact_results/SHA256SUMS

      - name: Upload exact queue pilot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RANK5_EXACT_SCIP_VIPR_MODEL589_PILOT_V1
          path: exact_results
          compression-level: 0
          retention-days: 30
